# itsjustmy.blog — Portada store screenshots.
# Copy, colors, fonts, the logo, capture URLs, and drop-in filenames live here.
# The renderer in tools/store-screenshots/ reads this file and nothing client-specific.
# See docs/STORE_SCREENSHOTS.md.

name: itsjustmy
display_name: itsjustmy.blog
logo: store/brand/icon.svg
captures_dir: store/captures
assets_dir: store/assets
output_dir: store/screenshots

colors:
  ink: "#0F172A"
  mint: "#6EE7B7"
  blue: "#2F6BEA"
  paper: "#F6F2E8"

fonts:
  display: Bodoni Moda
  sans: Archivo
  mono: IBM Plex Mono
  ui: Inter

status_time: "9:41"
feature_screen: web_blog_noapple.png
feature_nav_title: Emmanuel Serna Sandoval

# Logged-in screens the capture scripts cannot reach. Drop PNGs into captures_dir.
# iPhone files are 1170x2532 (390x844 @3x). iPad files are 2064x2752 (1032x1376 @2x).
# Leave the status bar and the native nav bar out of the PNG; the frame draws both.
drop_ins:
  - file: app_editor.png
    device: iphone
    width: 1170
    height: 2532
    note: Editor with a post being written.
  - file: ipad_editor.png
    device: ipad
    width: 2064
    height: 2752
    note: Same editor on the iPad 13" canvas.
  - file: app_dashboard.png
    device: iphone
    width: 1170
    height: 2532
    note: Dashboard. If this file is missing, app_posts.png is used.
  - file: app_posts.png
    device: iphone
    width: 1170
    height: 2532
    note: Post list fallback for the dashboard slide.
  - file: ipad_dashboard.png
    device: ipad
    width: 2064
    height: 2752
    note: iPad dashboard. If this file is missing, ipad_posts.png is used.
  - file: ipad_posts.png
    device: ipad
    width: 2064
    height: 2752
    note: iPad post list fallback for the dashboard slide.

locales:
  es:
    lang: es
    folio: ["itsjustmy.blog", "Edición de bolsillo", "Nº 01", "Otoño 2026"]
    pending: Captura pendiente
    feature:
      headline: "Tu blog,<br><em>en tu bolsillo.</em>"
      tag: Un hogar para tus palabras
    slides:
      - id: 01-blog
        phone: l
        theme: ink
        kicker: Portada
        headline: "Tu blog,<br><em>en tu bolsillo.</em>"
        sub: Tu perfil, tus categorías y todo lo que publicas, a un toque.
        badge: "Registro<br>gratis"
        screen:
          ipad: [ipad_blog.png]
          srcs: [web_blog_noapple.png]
          nav:
            title: Emmanuel Serna Sandoval
      - id: 02-editor
        phone: l
        theme: paper
        kicker: Editor
        headline: "Escribe<br><em>donde estés.</em>"
        sub: Escribe y guarda borradores desde el teléfono, cuando llegue la idea.
        screen:
          ipad: [ipad_editor.png]
          srcs: [app_editor.png]
          label: editor
          nav:
            title: Nuevo post
            back: true
        slip:
          k: Incluido
          t: "Borradores<br><em>ilimitados</em>"
      - id: 03-post
        theme: mint
        kicker: Sin ruido
        headline: "Publica<br><em>sin ruido.</em>"
        sub: Sin anuncios ni algoritmos. Solo tus palabras y quien quiera leerlas.
        quote: Hay finales que quedan en la memoria por la espectacularidad en la cancha. Esta no.
        cite: Emmanuel Serna · Deportes
        screen:
          ipad: [ipad_post_espana.png]
          ipadScroll: 860
          srcs: [web_post_espana.png]
          nav:
            title: España Campeón y el adiós de Messi
            back: true
          scroll: 760
      - id: 04-dashboard
        phone: l
        theme: ink
        kicker: Panel
        headline: "Todo tu blog,<br><em>a la mano.</em>"
        sub: Tus borradores y tus publicaciones, en un solo lugar.
        screen:
          ipad: [ipad_dashboard.png, ipad_posts.png]
          srcs: [app_dashboard.png, app_posts.png]
          label: panel / posts
          nav:
            title: Panel
        slip:
          k: Estado
          rows:
            - [on, Publicado]
            - [off, Borrador]
      - id: 05-categories
        theme: paper
        kicker: Índice
        headline: "Tus temas,<br><em>en su lugar.</em>"
        sub: Agrupa tus posts por categoría y cada lector encuentra lo suyo.
        index:
          title: Índice
          items: [Deportes, Tecnología, Código, Pensamientos]
          active: Código
        screen:
          ipad: [ipad_cat_codigo.png]
          srcs: [web_cat_codigo.png]
          nav:
            title: Código
            back: true
      - id: 06-username
        theme: blue
        kicker: Clasificados
        headline: "Tu nombre<br><em>al frente.</em>"
        sub: "Elige tu usuario: tu blog vive en tu propio subdominio."
        name: lacronista
        domain: .itsjustmy.blog
        popout: crop_username_clean.png
        popoutIpad: crop_username_ipad.png
        screen:
          ipad: [ipad_sign_up.png]
          srcs: [sign_up_clean.png]
