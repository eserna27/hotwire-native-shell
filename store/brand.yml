# Public pages the capture scripts can open. Drop-ins above are not listed here.
captures:
  - file: web_blog_noapple.png
    url: https://eserna27.itsjustmy.blog/
    device: iphone
    user_agent: safari
    locale: es-MX
    steps:
      - add_class: hotwire-native
      - remove_link_card:
          href_contains: /posts/surprise-and-shine
          group_href_contains: /posts/
      - wait_ms: 400
  - file: web_post_espana.png
    url: https://eserna27.itsjustmy.blog/posts/espana-campeon-y-el-adios-de-messi
    device: iphone
    user_agent: safari
    locale: es-MX
    steps:
      - add_class: hotwire-native
      - wait_ms: 300
  - file: web_cat_codigo.png
    url: https://eserna27.itsjustmy.blog/categories/codigo
    device: iphone
    user_agent: safari
    locale: es-MX
    steps:
      - add_class: hotwire-native
      - wait_ms: 300
  - file: sign_up_clean.png
    url: https://itsjustmy.blog/users/sign_up
    device: iphone
    user_agent: native
    locale: es-MX
    steps:
      - click: input[placeholder="tu usuario"]
      - type:
          text: lacronista
          delay: 50
      - wait_ms: 2500
      - blur: true
      - hide:
          - ".cf-turnstile"
          - "[data-controller~=\"turnstile\"]"
          - "[class*=\"turnstile\"]"
      - wait_ms: 600
      - clip_around_input:
          input: input[placeholder="tu usuario"]
          extra_text: Libre
          out: crop_username_clean.png
  - file: ipad_blog.png
    url: https://eserna27.itsjustmy.blog/
    device: ipad
    user_agent: safari
    locale: es-MX
    steps:
      - add_class: hotwire-native
      - remove_link_card:
          href_contains: /posts/surprise-and-shine
          group_href_contains: /posts/
      - wait_ms: 400
  - file: ipad_post_espana.png
    url: https://eserna27.itsjustmy.blog/posts/espana-campeon-y-el-adios-de-messi
    device: ipad
    user_agent: safari
    locale: es-MX
    steps:
      - add_class: hotwire-native
      - wait_ms: 300
  - file: ipad_cat_codigo.png
    url: https://eserna27.itsjustmy.blog/categories/codigo
    device: ipad
    user_agent: safari
    locale: es-MX
    steps:
      - add_class: hotwire-native
      - wait_ms: 300
  - file: ipad_sign_up.png
    url: https://itsjustmy.blog/users/sign_up
    device: ipad
    user_agent: native
    locale: es-MX
    steps:
      - click: input[placeholder="tu usuario"]
      - type:
          text: lacronista
          delay: 50
      - wait_ms: 2500
      - blur: true
      - hide:
          - ".cf-turnstile"
          - "[data-controller~=\"turnstile\"]"
      - wait_ms: 500
      - clip_around_input:
          input: input[placeholder="tu usuario"]
          extra_text: Libre
          out: crop_username_ipad.png
