<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- Portada store template. Brand copy, colors, and fonts come from brand.runtime.js (store/brand.yml). ?lang=&fmt=ios|ipad|play -->
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<link rel="stylesheet" href="../shared/phone.css">
<script src="../shared/phone.js"></script>
<script src="brand.runtime.js"></script>
<script>
const Q=new URLSearchParams(location.search); window.LANG=Q.get('lang')||'es'; window.FMT=Q.get('fmt')||'ios';
if(!window.BRAND) throw new Error('brand.runtime.js missing — run tools/store-screenshots/render.js');
(function(){
  const c=window.BRAND.colors||{}, f=window.BRAND.fonts||{}, root=document.documentElement;
  if(c.ink) root.style.setProperty('--ink', c.ink);
  if(c.mint) root.style.setProperty('--mint', c.mint);
  if(c.blue) root.style.setProperty('--blue', c.blue);
  if(c.paper) root.style.setProperty('--paper', c.paper);
  if(f.display) root.style.setProperty('--font-display', "'"+f.display+"'");
  if(f.sans) root.style.setProperty('--font-sans', "'"+f.sans+"'");
  if(f.mono) root.style.setProperty('--font-mono', "'"+f.mono+"'");
  if(f.ui) root.style.setProperty('--font-ui', "'"+f.ui+"'");
})();
</script>
<style>
:root{--ink:#0F172A;--mint:#6EE7B7;--blue:#2F6BEA;--paper:#F6F2E8;--font-display:var(--font-display);--font-sans:var(--font-sans);--font-mono:var(--font-mono);--font-ui:'Inter'}
*{box-sizing:border-box;margin:0}
body{overflow:hidden;background:var(--ink)}
#stage{position:relative;overflow:hidden}
.slide{position:absolute;top:0;width:var(--W);height:var(--H);overflow:hidden}
.t-ink{--bgc:var(--ink);--fg:var(--paper);--acc:var(--mint);--rule:rgba(246,242,232,.16)}
.t-paper{--bgc:var(--paper);--fg:var(--ink);--acc:var(--blue);--rule:rgba(15,23,42,.13)}
.t-mint{--bgc:var(--mint);--fg:var(--ink);--acc:#1D4ED8;--rule:rgba(15,23,42,.15)}
.t-blue{--bgc:var(--blue);--fg:var(--paper);--acc:var(--mint);--rule:rgba(246,242,232,.24)}
.bg{position:absolute;inset:0;background:var(--bgc)}
.cols{position:absolute;top:0;bottom:0;left:var(--m);right:var(--m);display:grid;grid-template-columns:repeat(4,1fr)}
.cols i{border-left:calc(2px*var(--u)) solid var(--rule)}.cols i:last-child{border-right:calc(2px*var(--u)) solid var(--rule)}
.fwrap{position:absolute;left:0;right:0;top:var(--folioTop);height:calc(64px*var(--u));overflow:hidden;z-index:4}
.folio{position:absolute;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;
  font:600 calc(30px*var(--u))/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);opacity:.78}
.folio span{padding:0 calc(34px*var(--u))}.folio b{display:inline-block;width:calc(240px*var(--u));height:calc(3px*var(--u));background:currentColor}
.copy{position:absolute;left:var(--m);right:var(--m);top:var(--copyTop);z-index:6;display:flex;flex-direction:column;gap:calc(44px*var(--u))}
.kicker{display:flex;gap:calc(26px*var(--u));align-items:center;font:800 calc(46px*var(--u))/1 var(--font-sans);font-stretch:68%;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.kicker .no{font:italic 700 calc(60px*var(--u))/1 var(--font-display);font-variation-settings:'opsz' 28;letter-spacing:0}
.kicker .bar{width:calc(80px*var(--u));height:calc(10px*var(--u));background:var(--acc)}
/* Headline: heavier weight + low optical size so hairlines survive thumbnails */
h1{font-family:var(--font-display);font-weight:560;font-variation-settings:'opsz' 30;font-size:var(--hs);line-height:.92;letter-spacing:-.03em;color:var(--fg);white-space:nowrap}
h1 em{font-style:italic;font-weight:620;color:var(--acc)}
.sub{font:500 calc(50px*var(--u))/1.3 var(--font-sans);font-stretch:88%;color:var(--fg);opacity:.88;max-width:calc(860px*var(--u))}
.phone{z-index:5}
.badge{position:absolute;z-index:7;width:calc(290px*var(--u));height:calc(290px*var(--u));border-radius:50%;background:var(--mint);color:var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);
  font:800 calc(54px*var(--u))/1.02 var(--font-sans);font-stretch:66%;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 0 0 calc(10px*var(--u)) var(--ink),0 0 0 calc(14px*var(--u)) var(--mint)}
.slab{position:absolute;z-index:8;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:center;border-top:calc(14px*var(--u)) solid var(--paper)}
.slab p{font:italic 600 calc(64px*var(--u))/1.14 var(--font-display);font-variation-settings:'opsz' 40;letter-spacing:-.01em}
.slab cite{display:block;margin-top:calc(38px*var(--u));font:700 calc(30px*var(--u))/1 var(--font-mono);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}
.tail{position:absolute;z-index:4;right:0}
.index{position:absolute;z-index:8;background:var(--blue);color:var(--paper);border-top:calc(14px*var(--u)) solid var(--ink)}
.index h3{font:italic 700 calc(64px*var(--u))/1 var(--font-display);font-variation-settings:'opsz' 40;color:var(--mint);margin-bottom:calc(16px*var(--u))}
.index li{list-style:none;display:flex;align-items:baseline;gap:calc(18px*var(--u));padding:calc(10px*var(--u)) 0;border-top:calc(2px*var(--u)) solid rgba(246,242,232,.3)}
.index li .r{font:600 calc(30px*var(--u))/1 var(--font-mono);color:var(--mint);width:calc(70px*var(--u))}
.index li .n{font:700 calc(46px*var(--u))/1 var(--font-sans);font-stretch:75%;letter-spacing:.02em}
.index ul{padding:0}
.index li.on .n{color:var(--mint)}.index li.on .n::after{content:' ←';font-weight:500}
.plate{position:absolute;z-index:3;left:var(--m);right:var(--m);display:flex;flex-direction:column;white-space:nowrap;
  border-top:calc(6px*var(--u)) solid var(--ink);border-bottom:calc(2px*var(--u)) solid var(--ink);padding:calc(30px*var(--u)) 0 calc(28px*var(--u))}
.plate .n{font:italic 650 calc(230px*var(--u))/1 var(--font-display);font-variation-settings:'opsz' 40;letter-spacing:-.04em;color:var(--ink)}
.plate .d{font:800 calc(62px*var(--u))/1 var(--font-sans);font-stretch:62%;letter-spacing:.32em;text-transform:uppercase;color:var(--paper);margin-top:calc(16px*var(--u))}
.pop{position:absolute;z-index:9;background:#fff;padding:calc(30px*var(--u)) calc(34px*var(--u)) calc(22px*var(--u));box-shadow:0 calc(40px*var(--u)) calc(80px*var(--u)) rgba(10,20,60,.4)}
.pop img{display:block;width:100%}
/* slip: small editorial card overlapping the phone edge */
.slip{position:absolute;z-index:8;background:#fff;color:var(--ink);padding:calc(40px*var(--u)) calc(44px*var(--u)) calc(44px*var(--u));
  border-top:calc(14px*var(--u)) solid var(--acc);box-shadow:0 calc(30px*var(--u)) calc(60px*var(--u)) rgba(15,23,42,.28)}
.slip .k{font:700 calc(28px*var(--u))/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:#475569;margin-bottom:calc(22px*var(--u))}
.slip .t{font:600 calc(72px*var(--u))/.98 var(--font-display);font-variation-settings:'opsz' 30;letter-spacing:-.02em}
.slip .t em{font-style:italic;color:var(--blue)}
.slip .row{display:flex;align-items:center;gap:calc(22px*var(--u));font:700 calc(54px*var(--u))/1 var(--font-sans);font-stretch:75%;padding:calc(14px*var(--u)) 0}
.slip .row i{width:calc(30px*var(--u));height:calc(30px*var(--u));border-radius:50%;border:calc(5px*var(--u)) solid var(--ink)}
.slip .row i.on{background:#10B981;border-color:#10B981}
/* placeholder screen for captures that need login */
.ph{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#F1F2F4 0 calc(9*var(--k)),#fff calc(9*var(--k)) calc(18*var(--k)));display:flex;align-items:center;justify-content:center}
.tablet .ph{--k:calc(var(--tsw)/470)}
.ph .box{width:78%;padding:9% 6%;border:calc(2.5*var(--k)) dashed #94A3B8;border-radius:calc(12*var(--k));background:#fff;text-align:center;color:var(--ink)}
.ph .k{font:700 calc(14*var(--k))/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:#DC2626}
.ph .n{font:italic 600 calc(42*var(--k))/1 var(--font-display);margin:calc(16*var(--k)) 0 calc(14*var(--k))}
.ph .f{font:500 calc(12.5*var(--k))/1.5 var(--font-mono);color:#475569}
</style></head><body><div id="stage"></div>
<script>
const F={
  ios: {W:1320,H:2868,m:104,folioTop:96,copyTop:250,phoneTop:1110,phoneW:1000,hs:200},
  play:{W:1080,H:1920,m:86,folioTop:60,copyTop:150,phoneTop:735,phoneW:740,hs:164},
  // iPad 13" portrait: own size scale (u) so type isn't blown up 1.56x; device = CSS tablet frame
  ipad:{W:2064,H:2752,m:150,folioTop:110,copyTop:280,phoneTop:1270,phoneW:1640,hs:280,u:1.3,device:'tablet',
        idxTop:600 /* below the category chips in ipad_cat_codigo.png */, plateShift:600},
}[FMT];
const TAB=F.device==='tablet';
F.u=F.u||F.W/1320; F.vy=(F.H-F.phoneTop)/1758; // u: size scale, vy: vertical scale of the zone under the copy
const u=F.u,X=v=>v*u,Y=dy=>F.phoneTop+dy*F.vy;
const C0=window.BRAND.locales[LANG]; if(!C0) throw new Error('brand.yml has no locale '+LANG); const S=C0.slides.length;
window.SLIDE_COUNT=S; window.SLIDE_IDS=C0.slides.map(s=>s.id); window.SLIDE_W=F.W; window.SLIDE_H=F.H;
document.documentElement.lang=C0.lang||LANG;
const st=document.getElementById('stage');
Object.entries({W:F.W+'px',H:F.H+'px',m:F.m+'px',folioTop:F.folioTop+'px',copyTop:F.copyTop+'px',u:u,hs:F.hs+'px'}).forEach(([k,v])=>st.style.setProperty('--'+k,v));
st.style.width=F.W*S+'px'; st.style.height=F.H+'px';
const exists=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=src;});
const CAP=(window.BRAND.captures_uri||'').replace(/\/$/,'');
const capUrl=name=>CAP+'/'+String(name).split('/').map(encodeURIComponent).join('/');
const romans=['01','02','03','04','05','06','07','08'];
(async()=>{
  const C=window.BRAND.locales[LANG];
  if(!C) throw new Error('brand.yml has no locale '+LANG);
  window.CONTENT=C;
  for(const s of C.slides){ s._list=TAB?(s.screen.ipad||[]):(s.screen.srcs||[]); s._src=null; for(const f of s._list){ if(await exists(capUrl(f))){ s._src=capUrl(f); break; } } }
  let folioParts=''; for(let r=0;r<S*2;r++) folioParts+=C.folio.map(x=>`<span>${x}</span><b></b>`).join('');
  C.slides.forEach((s,i)=>{
    const el=document.createElement('section'); el.className='slide t-'+s.theme; el.style.left=i*F.W+'px';
    const right = (s.phone||'r')==='r'; // per-slide phone side: content 'phone:"l"|"r"'
    let pTop=F.phoneTop, pLeft=right?X(300):X(150);
    if(FMT==='play') pLeft=right?F.W-F.phoneW-X(70):X(120);
    if(TAB) pLeft=right?F.W-F.phoneW-X(70):X(90);
    if(s.name) pTop=Y(F.plateShift||520);
    let h=`<div class="bg"></div><div class="cols"><i></i><i></i><i></i><i></i></div>
      <div class="fwrap"><div class="folio" style="left:${-i*F.W}px">${folioParts}</div></div>
      <div class="copy"><div class="kicker"><span class="no">${String(i+1).padStart(2,'0')}</span><span class="bar"></span><span>${s.kicker}</span></div>
      <h1>${s.headline}</h1><p class="sub">${s.sub}</p></div>`;
    const frame=s.theme==='ink'?'#E9E4D8':(window.BRAND.colors&&window.BRAND.colors.ink)||'#0F172A';
    const ph = s._src?null:`<div class="ph"><div class="box"><div class="k">${C.pending}</div><div class="n">${s.screen.label||s._list[0]}</div>
       <div class="f">captures/${s._list[0]}<br>${TAB?'2064 × 2752':'1170 × 2532'}</div></div></div>`;
    const dev={...s.screen,src:s._src,placeholder:ph,frame,time:window.BRAND.status_time||'9:41',style:`left:${pLeft}px;top:${pTop}px`};
    h+= TAB ? tablet({...dev,tw:F.phoneW,scroll:s.screen.ipadScroll||0}) : phone({...dev,pw:F.phoneW});
    // geometry shared by a feature block and its tail on the previous slide
    const slabTop=Y(880), slabG={top:slabTop,h:Math.min(X(640),F.H-slabTop-X(60))},
          idxG={top:TAB?F.phoneTop+F.idxTop:F.phoneTop+1060*F.phoneW/1000,h:X(430)}  // index anchored to phone scale so it never covers the category chips;
    const next=C.slides[i+1];
    if(next&&next.quote) h+=`<div class="tail" style="top:${slabG.top}px;height:${slabG.h}px;width:${X(300)}px;background:var(--ink);border-top:${X(14)}px solid var(--paper)"></div>`;
    if(next&&next.index) h+=`<div class="tail" style="top:${idxG.top}px;height:${idxG.h}px;width:${X(300)}px;background:var(--blue);border-top:${X(14)}px solid var(--ink)"></div>`;
    if(s.slip) h+=`<div class="slip" style="left:${pLeft+F.phoneW-X(300)}px;top:${Y(260)}px;width:${X(440)}px"><div class="k">${s.slip.k}</div>${s.slip.t?`<div class="t">${s.slip.t}</div>`:''}${(s.slip.rows||[]).map(([c,t])=>`<div class="row"><i class="${c}"></i>${t}</div>`).join('')}</div>`;
    if(s.badge) h+=`<div class="badge" style="left:${pLeft+F.phoneW-X(200)}px;top:${pTop-X(150)}px">${s.badge}</div>`;
    if(s.quote) h+=`<blockquote class="slab" style="left:${-X(10)}px;top:${slabG.top}px;height:${slabG.h}px;width:${X(900)}px;padding:0 ${X(70)}px 0 ${X(F.m/u)}px"><p>“${s.quote}”</p><cite>— ${s.cite}</cite></blockquote>`;
    if(s.index) h+=`<div class="index" style="left:0;top:${idxG.top}px;height:${idxG.h}px;width:${X(640)}px;padding:${X(40)}px ${X(56)}px 0 ${F.m}px"><h3>${s.index.title}</h3><ul>${s.index.items.map((t,k)=>`<li class="${t===s.index.active?'on':''}"><span class="r">${romans[k]}</span><span class="n">${t}</span></li>`).join('')}</ul></div>`;
    if(s.name) h+=`<div class="plate" style="top:${Y(-60)}px"><span class="n">${s.name}</span><span class="d">${s.domain}</span></div>`;
    if(s.popout) h+=`<div class="pop" style="left:${X(40)}px;top:${Y(1120)}px;width:${X(860)}px"><img src="${TAB&&s.popoutIpad?s.popoutIpad:s.popout}"></div>`;
    el.innerHTML=h; st.appendChild(el);
  });
  await document.fonts.ready;
  // one headline size for the whole set: largest size at which every line of every headline fits
  const avail=F.W-2*F.m; let hs=F.hs;
  const widest=()=>Math.max(...[...document.querySelectorAll('h1')].map(h=>h.scrollWidth));
  while(widest()>avail && hs>60){ hs-=2; st.style.setProperty('--hs',hs+'px'); }
  window.HEADLINE_PX=hs;
  await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  window.READY=true;
})();
</script></body></html>
